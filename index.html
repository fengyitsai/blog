<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="icon" href="{{ site.baseurl }}/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      line-height: 1.6;
    }

    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 2rem;
      border: 2px solid #222;
      transition: border-color 0.3s;
    }

    .avatar:hover {
      border-color: #555;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .tagline {
      font-size: 0.95rem;
      color: #777;
      margin-bottom: 2rem;
      font-weight: 300;
    }

    .bio {
      font-size: 0.95rem;
      color: #999;
      margin-bottom: 2.5rem;
      line-height: 1.7;
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }

    .links a {
      color: #666;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: color 0.2s;
      padding: 0.4rem 0;
      border-bottom: 1px solid transparent;
    }

    .links a:hover {
      color: #fff;
      border-bottom-color: #444;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: #333;
      margin: 0 auto 2rem;
    }

    @media (max-width: 480px) {
      body { padding: 1.5rem; }
      h1 { font-size: 1.5rem; }
      .avatar { width: 100px; height: 100px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="avatar" src="{{ site.baseurl }}/assets/images/avatar.png" alt="{{ site.author }}">
    <h1>{{ site.author }}</h1>
    <p class="tagline">Software Engineer</p>
    <div class="divider"></div>
    <p class="bio">
      Hi, I'm Fengyi. Feel free to reach out — I'm always open to interesting conversations and collaborations.
    </p>
    <div class="links">
      <a href="mailto:{{ site.email }}">Email</a>
      <a href="https://github.com/{{ site.theme.social.github }}" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>
</body>
</html>
